<div
  class="bg-background h-[calc(100vh_-_2.25rem_-_3.5rem)] overflow-y-auto scrollbar-hide pb-2"
>
  <div
    class="h-[3rem] w-full flex flex-col items-center justify-center text-white"
  >
    <app-channel-item
      class="w-full"
      [channel]="{
        id: '',
        name: 'Direct Messages',
        avatarUrl: '/assets/icons/logo-ff-icon.png',
        hasActivity: false
      }"
      [href]="`/chat/channels/@me`"
      [isActive]="'@me' === chatSidebarService.currentChannelId()"
    ></app-channel-item>
  </div>
  <div class="text-white flex flex-col justify-center gap-y-2">
    @for (channel of chatChannelService.channels(); track $index) {
    <app-channel-item
      [channel]="channel"
      [href]="`/chat/channels/${channel.id}`"
      [isActive]="channel.id === chatSidebarService.currentChannelId()"
    ></app-channel-item>
    }
  </div>
</div>
